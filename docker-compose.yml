services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bllro
      POSTGRES_PASSWORD: bllro
      POSTGRES_DB: bllro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bllro -d bllro"]
      interval: 5s
      timeout: 5s
      retries: 10

  blob:
    profiles: ["minio"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bllro
      MINIO_ROOT_PASSWORD: bllrosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
